name: Build & Release Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Electron EXE
        run: npm run electron:build

      # 1. Luôn lưu file .exe vào Artifacts để tải ngay trong trang Summary
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fu-waypoint-windows-exe
          path: dist-electron/*.exe

      # 2. Tự động tạo Release v2.0.0 và gắn file .exe lên đó (không bị skip nữa)
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "fu WAYPOINT v2.0.0"
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
