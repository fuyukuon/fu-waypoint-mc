name: Build & Release Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Obsolete Icon Files
        shell: bash
        run: rm -rf public build scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Electron EXE
        run: npm run electron:build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          # Đổi tên file tải lên theo tag mới nhất
          name: fu-WAYPOINT-${{ github.ref_name }}-windows-exe
          path: dist-electron/*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        # Chỉ chạy bước tạo release nếu trigger là do push tag (bỏ qua nếu push code lên main)
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Tự động lấy tên tag làm tên release (ví dụ: v2.1.3)
          tag_name: ${{ github.ref_name }}
          name: "fu-WAYPOINT ${{ github.ref_name }}"
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
