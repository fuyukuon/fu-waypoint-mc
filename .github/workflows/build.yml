name: Build & Release Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tự động dọn dẹp các thư mục icon cũ bị lỗi nếu còn sót trên GitHub
      - name: Clean Obsolete Icon Files
        shell: bash
        run: rm -rf public build scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Electron EXE
        run: npm run electron:build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fu-WAYPOINT-v2.1.2-windows-exe
          path: dist-electron/*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.2
          name: "fu-WAYPOINT v2.1.2"
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
