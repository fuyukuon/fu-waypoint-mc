name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap init "fu WAYPOINT" "com.fuwaypoint.mc" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Đổi tên file cho dễ nhận diện trên điện thoại
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./fu-waypoint-v2.0.0.apk

      # 1. Lưu dự phòng vào Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fu-waypoint-android-apk
          path: fu-waypoint-v2.0.0.apk

      # 2. Đẩy thẳng file APK vào mục GitHub Release v2.0.0
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "fu WAYPOINT v2.0.0"
          files: fu-waypoint-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
