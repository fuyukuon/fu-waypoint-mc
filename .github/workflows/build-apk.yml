name: Build & Release Android APK



on:

  release:

    types: [published]

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build-and-release-android:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout code

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 22



      - name: Setup Java JDK

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '21'



      - name: Install Dependencies

        run: |

          npm install

          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest



      - name: Build Web App

        run: npm run build



      - name: Create Capacitor Config

        run: |

          cat << 'EOF' > capacitor.config.json

          {

            "appId": "com.fuwaypoint.mc",

            "appName": "fu WAYPOINT",

            "webDir": "dist"

          }

          EOF



      - name: Add & Sync Android Project

        run: |

          npx cap add android

          npx cap sync android



      - name: Build Android APK

        run: |

          cd android

          chmod +x ./gradlew

          ./gradlew assembleDebug --no-daemon



      # Đổi tên file tự động theo tên Tag của Release

      - name: Prepare APK File

        run: |

          cp android/app/build/outputs/apk/debug/app-debug.apk ./fu-waypoint-${{ github.event.release.tag_name }}.apk



      # Lưu dự phòng vào Artifacts

      - name: Upload APK Artifact

        uses: actions/upload-artifact@v4

        with:

          name: fu-waypoint-android-apk

          path: fu-waypoint-${{ github.event.release.tag_name }}.apk



      # Đẩy APK vào đúng cái Release cậu vừa tạo

      - name: Upload APK to GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ github.event.release.tag_name }}

          name: ${{ github.event.release.name }}

          files: fu-waypoint-${{ github.event.release.tag_name }}.apk

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
